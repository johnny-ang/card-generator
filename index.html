<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賀成交 · 業務卡產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Bebas+Neue&family=Oswald:wght@600&family=Anton&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:        #c8951a;
  --gold-light:  #f0c040;
  --gold-dim:    rgba(200,149,26,0.15);
  --dark:        #0d0c09;
  --surface:     #161410;
  --surface2:    #1e1b14;
  --border:      rgba(200,149,26,0.18);
  --text:        #e8e0cc;
  --muted:       #7a6e52;
  --radius:      10px;
  --success:     #5cb87a;
  --error:       #e06060;
}

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 36px 20px 80px;
}

/* ── Header ── */
header {
  text-align: center;
  margin-bottom: 36px;
}
.brand {
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 6px;
}
header h1 {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.02em;
}

/* ── Progress bar ── */
.progress {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 32px;
}
.step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  transition: color 0.3s;
}
.step.active { color: var(--gold); }
.step.done   { color: var(--success); }
.step-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  transition: all 0.3s;
  flex-shrink: 0;
}
.step.active .step-dot { background: var(--gold); color: #000; border-color: var(--gold); }
.step.done   .step-dot { background: var(--success); color: #fff; border-color: var(--success); }
.step-line {
  width: 40px; height: 1px;
  background: var(--border);
  flex-shrink: 0;
}

/* ── Layout ── */
.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 28px;
  width: 100%;
  max-width: 980px;
  align-items: start;
}

/* ── Form Panel ── */
.form-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.section-label {
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 2px;
}

.field { display: flex; flex-direction: column; gap: 5px; }

label { font-size: 12px; color: var(--muted); font-weight: 500; }

select, input[type="date"] {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  padding: 10px 13px;
  width: 100%;
  outline: none;
  transition: border-color 0.2s;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}
select:focus, input:focus { border-color: var(--gold); }
select option { background: #1a1710; }
select:disabled { opacity: 0.4; cursor: not-allowed; }

/* Loading skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, #28231a 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 7px;
  height: 42px;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* 業務預覽卡 */
.agent-preview {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  display: none;
  align-items: center;
  gap: 12px;
}
.agent-preview.show { display: flex; }
.agent-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--gold);
  flex-shrink: 0;
  background: var(--surface);
}
.agent-avatar-placeholder {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  font-size: 18px;
  flex-shrink: 0;
}
.agent-info-text { flex: 1; }
.agent-info-text strong { font-size: 15px; font-weight: 700; display: block; }
.agent-info-text span  { font-size: 12px; color: var(--muted); }

/* Logo 切換 */
.logo-row { display: flex; flex-direction: column; gap: 8px; }
.logo-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 12px;
}
.logo-name  { flex: 1; font-size: 13px; }
.logo-badge { font-size: 10px; color: var(--muted); }
.toggle-group {
  display: flex;
  background: var(--dark);
  border-radius: 5px;
  padding: 2px;
  gap: 2px;
}
.toggle-group button {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px;
  padding: 3px 9px;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  transition: all 0.15s;
  font-weight: 500;
}
.toggle-group button.active { background: var(--gold); color: #000; }

.divider { height: 1px; background: var(--border); margin: 2px 0; }

/* 產生按鈕 */
.btn-generate {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  color: #000;
  border: none;
  border-radius: 8px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  font-weight: 700;
  padding: 13px;
  cursor: pointer;
  width: 100%;
  letter-spacing: 0.05em;
  transition: opacity 0.2s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.btn-generate:hover   { opacity: 0.9; }
.btn-generate:active  { transform: scale(0.98); }
.btn-generate:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

#status-msg {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  min-height: 16px;
  transition: color 0.2s;
}
#status-msg.ok  { color: var(--success); }
#status-msg.err { color: var(--error); }

/* ── Preview Panel ── */
.preview-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.preview-label {
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
}
#canvas-wrapper {
  width: 100%;
  background: #0a0a0a;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
#output-canvas { width: 100%; height: auto; display: none; }
.canvas-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--muted);
  gap: 10px;
}
.canvas-placeholder p { font-size: 12px; }

.btn-download {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 9px 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 7px;
  align-self: flex-end;
}
.btn-download:hover    { border-color: var(--gold); color: var(--gold); }
.btn-download:disabled { opacity: 0.3; cursor: not-allowed; }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  .step-line { width: 24px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">永義房屋 · 喆禮加盟店</div>
  <h1>賀成交業務卡產生器</h1>
</header>

<!-- 進度條 -->
<div class="progress">
  <div class="step done" id="p1"><div class="step-dot">✓</div><span>資料載入</span></div>
  <div class="step-line"></div>
  <div class="step active" id="p2"><div class="step-dot">2</div><span>填寫表單</span></div>
  <div class="step-line"></div>
  <div class="step" id="p3"><div class="step-dot">3</div><span>產生名片</span></div>
  <div class="step-line"></div>
  <div class="step" id="p4"><div class="step-dot">4</div><span>下載</span></div>
</div>

<!-- iOS 存圖提示 -->
<div id="ios-hint" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;align-items:flex-end;justify-content:center;">
  <div style="background:var(--surface);border-radius:16px 16px 0 0;padding:28px 24px 40px;width:100%;max-width:480px;text-align:center;">
    <div style="font-size:13px;color:var(--gold);letter-spacing:0.2em;margin-bottom:12px">iOS 存圖步驟</div>
    <div style="font-size:15px;font-weight:700;margin-bottom:20px;line-height:1.6">
      長按下方圖片<br>→ 選擇「儲存到照片」
    </div>
    <img id="ios-preview" style="width:100%;max-width:320px;border-radius:8px;margin-bottom:20px;" />
    <br>
    <button onclick="document.getElementById('ios-hint').style.display='none'"
      style="background:var(--gold);color:#000;border:none;border-radius:8px;padding:12px 32px;font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:700;cursor:pointer;">
      關閉
    </button>
  </div>
</div>

<div class="layout">

  <!-- 左側表單 -->
  <div class="form-panel">

    <div class="field">
      <div class="section-label">業務資訊</div>
      <label>選擇單位</label>
      <div id="branch-skeleton" class="skeleton"></div>
      <select id="branch-select" style="display:none" onchange="onBranchChange()">
        <option value="">— 請選擇單位 —</option>
      </select>
    </div>

    <div class="field">
      <label>選擇業務</label>
      <select id="agent-select" disabled onchange="onAgentChange()">
        <option value="">— 請先選擇單位 —</option>
      </select>
    </div>

    <!-- 業務預覽 -->
    <div class="agent-preview" id="agent-preview">
      <div class="agent-avatar-placeholder" id="avatar-placeholder">👤</div>
      <img class="agent-avatar" id="agent-avatar" src="" alt="" style="display:none" />
      <div class="agent-info-text">
        <strong id="preview-name">—</strong>
        <span id="preview-phone">—</span>
      </div>
    </div>

    <div class="field">
      <label style="display:flex; align-items:center; justify-content:space-between;">
        成交日期
        <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:400; cursor:pointer;">
          <input type="checkbox" id="date-hidden" onchange="toggleDateVisible(this)"
            style="width:14px;height:14px;accent-color:var(--gold);cursor:pointer;">
          不顯示
        </span>
      </label>
      <div id="date-fields" style="display:flex; gap:8px;">
        <select id="deal-month" style="flex:1" onchange="updateDays()">
          <option value="">月</option>
          <option value="1">1月</option><option value="2">2月</option>
          <option value="3">3月</option><option value="4">4月</option>
          <option value="5">5月</option><option value="6">6月</option>
          <option value="7">7月</option><option value="8">8月</option>
          <option value="9">9月</option><option value="10">10月</option>
          <option value="11">11月</option><option value="12">12月</option>
        </select>
        <select id="deal-day" style="flex:1"></select>
      </div>
    </div>

    <div class="field">
      <label>行政區</label>
      <div style="display:flex; gap:8px;">
        <select id="district-select" style="flex:1" onchange="onDistrictChange()">
          <option value="">— 請選擇 —</option>
          <option value="桃園區">桃園區</option>
          <option value="中壢區">中壢區</option>
          <option value="平鎮區">平鎮區</option>
          <option value="八德區">八德區</option>
          <option value="八德區">大溪區</option>
          <option value="楊梅區">楊梅區</option>
          <option value="蘆竹區">蘆竹區</option>
          <option value="大園區">大園區</option>
          <option value="龜山區">龜山區</option>
          <option value="龍潭區">龍潭區</option>
          <option value="新屋區">新屋區</option>
          <option value="觀音區">觀音區</option>
          <option value="復興區">復興區</option>
          <option value="手動輸入">手動輸入…</option>
        </select>
        <input type="text" id="district-input" placeholder="輸入行政區"
          style="flex:1; display:none;" oninput="syncDistrictInput()" />
      </div>
    </div>

    <div class="field">
      <label>房型</label>
      <div style="display:flex; gap:8px;">
        <select id="house-type-select" style="flex:1" onchange="onHouseTypeChange()">
          <option value="">— 請選擇 —</option>
          <option value="兩房">兩房</option>
          <option value="兩房車">兩房車</option>
          <option value="三房">三房</option>
          <option value="三房車">三房車</option>
          <option value="四房">四房</option>
          <option value="四房車">四房車</option>
          <option value="透天">透天</option>
          <option value="美宅">美宅</option>
          <option value="店面">店面</option>
          <option value="土地">土地</option>
          <option value="廠房">套房</option>
          <option value="手動輸入">手動輸入…</option>
        </select>
        <input type="text" id="house-type-input" placeholder="輸入房型"
          style="flex:1; display:none;" oninput="syncHouseTypeInput()" />
      </div>
    </div>

    <div class="divider"></div>

    <!-- 成交團隊（保留功能但隱藏，需要時移除 style="display:none" 即可） -->
    <div style="display:none;">
    <div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <div class="section-label" style="margin-bottom:0">成交團隊</div>
        <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer;">
          <input type="checkbox" id="team-visible" onchange="toggleTeamVisible(this)"
            style="width:14px;height:14px;accent-color:var(--gold);cursor:pointer;">
          顯示
        </span>
      </div>
      <div id="team-fields" style="display:none;">
        <div class="logo-row">
          <div class="logo-item">
            <div class="logo-name">喆禮團隊</div>
            <span class="logo-badge">A</span>
            <div class="toggle-group">
              <button class="active" onclick="setLogo('logoA','color',this)">彩色</button>
              <button onclick="setLogo('logoA','bw',this)">黑白</button>
            </div>
          </div>
          <div class="logo-item">
            <div class="logo-name">心意豐團隊</div>
            <span class="logo-badge">B</span>
            <div class="toggle-group">
              <button class="active" onclick="setLogo('logoB','color',this)">彩色</button>
              <button onclick="setLogo('logoB','bw',this)">黑白</button>
            </div>
          </div>
          <div class="logo-item">
            <div class="logo-name">熊理想領航團隊</div>
            <span class="logo-badge">C</span>
            <div class="toggle-group">
              <button class="active" onclick="setLogo('logoC','color',this)">彩色</button>
              <button onclick="setLogo('logoC','bw',this)">黑白</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>


    <div class="divider"></div>

    <button class="btn-generate" id="btn-gen" onclick="generateCard()" disabled>✦ 產生業務卡</button>
    <div id="status-msg">載入業務資料中…</div>

  </div>

  <!-- 右側預覽 -->
  <div class="preview-panel">
    <div class="preview-label">名片預覽</div>
    <div id="canvas-wrapper">
      <div class="canvas-placeholder" id="placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        <p>填寫左側表單後點「產生名片」</p>
      </div>
      <canvas id="output-canvas"></canvas>
    </div>
    <button class="btn-download" id="btn-dl" disabled onclick="downloadCard()">↓ 下載圖片</button>
  </div>

</div>

<script>
// ── 設定 ──
const API_URL = "https://script.google.com/macros/s/AKfycbw-yw0sqW_PHb0AAEBGDEE1rB5kxxIVSLETWjjLVKnLmn0OZQ-zPn6y6-kBXHVtQvuf/exec";
const BG_URL  = "https://github.com/johnny-ang/card-generator/blob/a7b98a063374703545875615cd261576401eb0ad/202609%E5%BA%95%E5%9C%96.jpg";

// 品牌 Logo 對應表
const BRAND_LOGOS = {
  '永慶不動產': 'https://drive.google.com/uc?id=1LcuW_637pHoTXDPW23Rk7UYZSjunWlA0',
  '永義房屋':   'https://drive.google.com/uc?id=1EFqWLqVE69s1yANFGcWauNjkCGtiI5Vc',
  '有巢氏房屋': 'https://drive.google.com/uc?id=1LYLgFJxZ0_Tx7KkmxGdZ9GD_eFmma2na',
};
const LAYOUT = {
  brand:     { x: 50,  y: 10,  w: 468, h: 185 },
  branch:    { x: 550, y: 20,  w: 510, h: 145 },
  photo:     { x: 270, y: 145, w: 520, h: 680, r: 12 },
  date:      { x: 680, y: 380, w: 380, h: 130 },
  name:      { x: 100, y: 840, w: 360, h: 110 },
  phone:     { x: 420, y: 850, w: 670, h: 110 },
  district:  { x: 20,  y: 270, w: 200, h: 200 },
  houseType: { x: 80,  y: 270, w: 200, h: 200 },
};

// ── 狀態 ──
let agents    = [];
let current   = null;
const logoModes = { logoA: 'color', logoB: 'color', logoC: 'color' };

// ── 初始化：載入業務資料 ──
async function loadAgents() {
  try {
    const res  = await fetch(`${API_URL}?action=getAgents`);
    const data = await res.json();
    agents = data.agents || [];
    // 確認 branch 欄位是否正確
    console.log('業務資料範例：', JSON.stringify(agents[0]));

    // 取出不重複的單位清單（依原始順序）
    const branches = [...new Set(agents.map(a => a.branch).filter(Boolean))];

    const branchSelect = document.getElementById('branch-select');
    branchSelect.innerHTML = '<option value="">— 請選擇單位 —</option>';
    branches.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      branchSelect.appendChild(opt);
    });

    document.getElementById('branch-skeleton').style.display = 'none';
    branchSelect.style.display = 'block';
    document.getElementById('btn-gen').disabled = false;
    setStatus('請選擇單位與業務');
    setProgress(2);

  } catch (e) {
    // 失敗時隱藏 skeleton，顯示空的下拉並提示
    document.getElementById('branch-skeleton').style.display = 'none';
    const branchSelect = document.getElementById('branch-select');
    branchSelect.innerHTML = '<option value="">— 載入失敗，請重新整理 —</option>';
    branchSelect.style.display = 'block';
    setStatus('無法載入業務資料，請重新整理頁面', 'err');
  }
}

// ── 單位選擇變更 → 篩選業務名單 ──
function onBranchChange() {
  const branch      = document.getElementById('branch-select').value;
  const agentSelect = document.getElementById('agent-select');

  // 重置業務下拉與預覽
  agentSelect.innerHTML = '<option value="">— 請選擇業務 —</option>';
  document.getElementById('agent-preview').classList.remove('show');
  current = null;

  if (!branch) {
    agentSelect.disabled = true;
    return;
  }

  // 依單位篩選業務（branch 欄位，index 4）
  const filtered = agents.filter(a => a.branch === branch);
  filtered.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.agent_id;
    opt.textContent = a.name;
    agentSelect.appendChild(opt);
  });
  agentSelect.disabled = false;
}

// ── 業務選擇變更 ──
function onAgentChange() {
  const id = document.getElementById('agent-select').value;
  current  = agents.find(a => a.agent_id === id) || null;

  const preview = document.getElementById('agent-preview');

  if (!current) {
    preview.classList.remove('show');
    return;
  }

  // 更新預覽
  document.getElementById('preview-name').textContent  = current.name;
  document.getElementById('preview-phone').textContent = current.phone;

  // 載入頭像
  const img         = document.getElementById('agent-avatar');
  const placeholder = document.getElementById('avatar-placeholder');

  if (current.photo_url) {
    img.crossOrigin = 'anonymous';
    img.src = proxyUrl(current.photo_url);
    img.onload  = () => { img.style.display = 'block'; placeholder.style.display = 'none'; };
    img.onerror = () => { img.style.display = 'none';  placeholder.style.display = 'flex'; };
  } else {
    img.style.display = 'none';
    placeholder.style.display = 'flex';
  }

  preview.classList.add('show');

  // 同步 Logo 模式
  setLogoFromData(current.logo_a_mode, 'logoA');
  setLogoFromData(current.logo_b_mode, 'logoB');
  setLogoFromData(current.logo_c_mode, 'logoC');

  // 預設今天月日
  const t = new Date();
  const dm = document.getElementById('deal-month');
  const dd = document.getElementById('deal-day');
  if (!dm.value) {
    dm.value = t.getMonth() + 1;
    updateDays();
    dd.value = t.getDate();
  }

  setStatus('選擇完成，可以產生名片');
}

function setLogoFromData(mode, key) {
  logoModes[key] = mode || 'color';
  // 更新 UI 按鈕
  const items = document.querySelectorAll(`.logo-item`);
  const keyMap = { logoA: 0, logoB: 1, logoC: 2 };
  const item = items[keyMap[key]];
  if (!item) return;
  item.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === (mode === 'bw' ? '黑白' : '彩色'));
  });
}

function setLogo(key, mode, btn) {
  logoModes[key] = mode;
  btn.closest('.toggle-group').querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setStatus(msg, type = '') {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = type;
}

function setProgress(step) {
  ['p1','p2','p3','p4'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.className = 'step' + (i+1 < step ? ' done' : i+1 === step ? ' active' : '');
    if (i+1 < step) el.querySelector('.step-dot').textContent = '✓';
    else el.querySelector('.step-dot').textContent = i+1;
  });
}

function updateDays(keepDay) {
  const month = parseInt(document.getElementById('deal-month').value) || new Date().getMonth() + 1;
  const year  = new Date().getFullYear();
  const days  = new Date(year, month, 0).getDate();
  const dd    = document.getElementById('deal-day');
  const prev  = keepDay !== undefined ? keepDay : dd.value;
  dd.innerHTML = '';
  for (let i = 1; i <= days; i++) {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = `${i}日`;
    dd.appendChild(opt);
  }
  const target = parseInt(prev) || new Date().getDate();
  dd.value = Math.min(target, days);
}

function initDate() {
  const t  = new Date();
  const dm = document.getElementById('deal-month');
  dm.value = t.getMonth() + 1;
  updateDays(t.getDate());
}

function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

// ────────────────────────────────────────────────────
//  主程式：產生名片
// ────────────────────────────────────────────────────
async function generateCard() {
  if (!current) { setStatus('請先選擇業務', 'err'); return; }
  const dateHidden = document.getElementById('date-hidden').checked;
  const month = document.getElementById('deal-month').value;
  const day   = document.getElementById('deal-day').value;
  if (!dateHidden && (!month || !day)) { setStatus('請選擇成交日期', 'err'); return; }

  const dateStr    = dateHidden ? '' : `${month}/${day}`;
  const district   = getDistrict();
  const houseType  = getHouseType();

  setStatus('合成中…');
  setProgress(3);
  document.getElementById('btn-gen').disabled = true;

  const canvas = document.getElementById('output-canvas');
  const ctx    = canvas.getContext('2d');
  const W = 1080, H = 1080;
  canvas.width = W; canvas.height = H;

  // 等待字型載入完成，避免手機端字型跑掉
  await document.fonts.load('400 90px "Anton"');
  await document.fonts.load('600 88px "Oswald"');
  await document.fonts.load('900 88px "Noto Sans TC"');

  // 載入底圖、業務照片、品牌 Logo
  setStatus('載入底圖中…');
  const brandLogoUrl = current.brand ? BRAND_LOGOS[current.brand] : null;
  const [bgImg, agentImg, brandImg] = await Promise.all([
    loadImage(proxyUrl(BG_URL)).catch(() => null),
    current.photo_url ? loadImage(proxyUrl(current.photo_url)).catch(() => null) : Promise.resolve(null),
    brandLogoUrl ? loadImage(proxyUrl(brandLogoUrl)).catch(() => null) : Promise.resolve(null)
  ]);

  // ── 開始繪製 ──
  // 1. 底圖
  if (bgImg) {
    ctx.drawImage(bgImg, 0, 0, W, H);
  } else {
    // 底圖載入失敗時用漸層代替
    drawBackground(ctx, W, H);
    drawStars(ctx, W, H);
  }

  // 2. 品牌 Logo（左上 brand 區域）
  if (brandImg) {
    drawBrandLogo(ctx, brandImg);
  }

  // 3. branch（綠框區域）
  if (current.branch) drawBranch(ctx, current.branch);

  // 4. 人物照片（紅框區域）
  if (agentImg) {
    drawAgentPhoto(ctx, agentImg);
  } else {
    drawAgentPhotoPlaceholder(ctx);
  }

  // 3. 姓名
  drawAgentName(ctx, current.name);

  // 4. 電話
  drawAgentPhone(ctx, current.phone);

  // 5. 日期（勾選不顯示時 dateStr 為空）
  if (dateStr) drawDate(ctx, dateStr);

  // 8. 行政區
  if (district) drawDistrict(ctx, district);

  // 9. 房型
  if (houseType) drawHouseType(ctx, houseType);

  // 10. 成交團隊 Logo
  if (document.getElementById('team-visible').checked) {
    drawTeamLogos(ctx, W, H);
  }

  // 顯示
  document.getElementById('placeholder').style.display = 'none';
  canvas.style.display = 'block';
  document.getElementById('btn-dl').disabled = false;
  document.getElementById('btn-gen').disabled = false;
  setStatus('✓ 業務卡已產生', 'ok');
  setProgress(4);
}

// Drive 圖片透過代理載入，解決 CORS 問題
function proxyUrl(url) {
  if (!url) return '';
  return 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace('https://', ''));
}

// 載入圖片 Promise
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// ────────────────────────────────────────────────────
//  繪製函式（對應底圖座標）
// ────────────────────────────────────────────────────

// 門市單位 - 白色字體＋描邊 59564f，靠左對齊
function drawBranch(ctx, branch) {
  const { x, y, w, h } = LAYOUT.branch;
  ctx.save();
  ctx.font = `500 50px "Noto Sans TC"`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#59564f';
  ctx.lineWidth = 12;
  ctx.strokeText(branch, x, y + h / 2);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(branch, x, y + h / 2);
  ctx.restore();
}

// 行政區（左側）- 直式靠上，固定 52px
function drawDistrict(ctx, district) {
  const { x, y, w, h } = LAYOUT.district;
  ctx.save();
  ctx.font = `500 52px "Noto Sans TC"`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#59564f';
  const lineH = 58;
  district.split('').forEach((ch, i) => {
    ctx.fillText(ch, x + w / 2, y + i * lineH);
  });
  ctx.restore();
}

// 房型（左側）- 直式靠上，固定 52px
function drawHouseType(ctx, houseType) {
  const { x, y, w, h } = LAYOUT.houseType;
  ctx.save();
  ctx.font = `500 52px "Noto Sans TC"`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#59564f';
  const lineH = 60;
  houseType.split('').forEach((ch, i) => {
    ctx.fillText(ch, x + w / 2, y + i * lineH);
  });
  ctx.restore();
}

// 品牌 Logo（左上，對應參考圖比例）
function drawBrandLogo(ctx, img) {
  const x = 50, y = 10, w = 468, h = 185;
  ctx.save();
  const scale = Math.min(w / img.width, h / img.height);
  const sw = img.width  * scale;
  const sh = img.height * scale;
  const sx = x;
  const sy = y + (h - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh);
  ctx.restore();
}

// 人物照片：智慧裁切（無描邊）
function drawAgentPhoto(ctx, img) {
  const { x, y, w, h, r } = LAYOUT.photo;

  const imgRatio = img.width / img.height;
  const scale    = Math.max(w / img.width, h / img.height);
  const sw = img.width  * scale;
  const sh = img.height * scale;
  const sx = x + (w - sw) / 2;

  let sy;
  if (imgRatio < 0.75)     { sy = y - (sh - h) * 0.15; }
  else if (imgRatio > 1.2) { sy = y - (sh - h) * 0.3;  }
  else                     { sy = y - (sh - h) * 0.2;  }

  ctx.save();
  roundRectPath(ctx, x, y, w, h, r);
  ctx.clip();
  ctx.drawImage(img, sx, sy, sw, sh);
  ctx.restore();
}

// 人物照片佔位
function drawAgentPhotoPlaceholder(ctx) {
  const { x, y, w, h, r } = LAYOUT.photo;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  roundRectPath(ctx, x, y, w, h, r);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '72px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('👤', x + w/2, y + h/2 + 24);
  ctx.restore();
}

// 姓名 - 白色字體＋描邊 59564f，手動字距 5px
function drawAgentName(ctx, name) {
  const { x, y, w, h } = LAYOUT.name;
  ctx.save();
  ctx.font = `900 88px "Noto Sans TC"`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const spacing = 5;
  let curX = x;
  for (let i = 0; i < name.length; i++) {
    const ch = name[i];
    ctx.strokeStyle = '#59564f';
    ctx.lineWidth = 12;
    ctx.strokeText(ch, curX, y + h / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(ch, curX, y + h / 2);
    curX += ctx.measureText(ch).width + spacing;
  }
  ctx.restore();
}

// 電話 - 白色字體＋描邊 59564f，Oswald
// 電話 - 白色字體＋描邊 59564f，Oswald，手動字距 5px
function drawAgentPhone(ctx, phone) {
  const { x, y, w, h } = LAYOUT.phone;
  ctx.save();
  ctx.font = `600 88px "Oswald"`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const spacing = 5;
  let curX = x;
  for (let i = 0; i < phone.length; i++) {
    const ch = phone[i];
    ctx.strokeStyle = '#59564f';
    ctx.lineWidth = 12;
    ctx.strokeText(ch, curX, y + h / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(ch, curX, y + h / 2);
    curX += ctx.measureText(ch).width + spacing;
  }
  ctx.restore();
}

// 日期 - 紅色字體＋白色描邊，Anton，手動字距
function drawDate(ctx, dateStr) {
  if (!dateStr) return;
  const { x, y, w, h } = LAYOUT.date;
  ctx.save();
  ctx.font = `400 90px "Anton"`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  const spacing = 20;
  const totalW  = ctx.measureText(dateStr).width + spacing * (dateStr.length - 1);
  let startX    = x + (w - totalW) / 2;

  for (let i = 0; i < dateStr.length; i++) {
    const ch = dateStr[i];
    ctx.strokeStyle = '#fcfbfa';
    ctx.lineWidth = 8;
    ctx.strokeText(ch, startX, y + h / 2);
    ctx.fillStyle = '#c82b3f';
    ctx.fillText(ch, startX, y + h / 2);
    startX += ctx.measureText(ch).width + spacing;
  }
  ctx.restore();
}

// 成交團隊 Logo（勾選時顯示，位置待 Step 8 替換圖檔）
function drawTeamLogos(ctx, W, H) {
  const logos = [
    { key: 'logoA', label: '喆禮團隊',     color: '#1e5c9c', x: 340, y: H-170 },
    { key: 'logoB', label: '心意豐團隊',   color: '#c8290a', x: 500, y: H-170 },
    { key: 'logoC', label: '熊理想領航',   color: '#2e7d32', x: 660, y: H-170 },
  ];
  logos.forEach(({ key, label, color, x, y }) => {
    const mode = logoModes[key];
    ctx.save();
    if (mode === 'bw') ctx.filter = 'grayscale(1)';
    ctx.fillStyle = mode === 'bw' ? '#555' : color;
    roundRectPath(ctx, x, y, 140, 44, 6);
    ctx.fill();
    ctx.filter = 'none';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Noto Sans TC"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + 70, y + 22);
    ctx.restore();
  });
}

// 備用背景（底圖載入失敗時）
function drawBackground(ctx, W, H) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0,    '#0b1a30');
  g.addColorStop(0.45, '#102040');
  g.addColorStop(0.75, '#c8811a');
  g.addColorStop(1,    '#e8a020');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawStars(ctx, W, H) {
  [[60,60],[200,45],[500,30],[900,40],[980,200]].forEach(([x,y]) => {
    ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill();
  });
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ── 下載 ──
function downloadCard() {
  const canvas     = document.getElementById('output-canvas');
  const dateHidden = document.getElementById('date-hidden').checked;
  const month      = document.getElementById('deal-month').value;
  const day        = document.getElementById('deal-day').value;
  const datePart   = dateHidden ? '' : `_${month}月${day}日`;
  const fileName   = `賀成交_${current?.name || '業務卡'}${datePart}.png`;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  if (isIOS) {
    // iOS：顯示圖片讓使用者長按存圖
    document.getElementById('ios-preview').src = canvas.toDataURL('image/png');
    document.getElementById('ios-hint').style.display = 'flex';
  } else {
    // Android / 電腦：直接下載到相簿或下載資料夾
    const link = document.createElement('a');
    link.download = fileName;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  document.getElementById('p4').className = 'step done';
  document.getElementById('p4').querySelector('.step-dot').textContent = '✓';
}
